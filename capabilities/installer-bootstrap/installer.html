<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup</title>
<style>
:root { color-scheme: dark; font-family: "Instrument Sans", system-ui, sans-serif; color: #f3f7f9; background: #0a1220; }
* { box-sizing: border-box; }
body { min-height: 100vh; margin: 0; padding: clamp(12px, 5vw, 64px); display: grid; place-items: center; }
[hidden] { display: none !important; }
main { position: relative; isolation: isolate; width: min(740px, 100%); overflow: hidden; border: 1px solid #426379;
  border-radius: 24px; padding: clamp(22px, 6vw, 64px); background: linear-gradient(150deg, #132741, #102f43 66%, #0b2638); box-shadow: 0 22px 75px #050d16; }
main::before { content: ""; pointer-events: none; position: absolute; z-index: -1; inset: auto -34% -340px -20%; height: 490px;
  transform: rotate(-12deg); border-radius: 50%; background: #1a5a64; box-shadow: 0 -22px #1a4a5c, 0 -43px #153d50; opacity: .55; }
header { text-align: center; margin-bottom: 24px; }
.symbol { width: 44px; height: 44px; margin: 0 auto 18px; border-radius: 13px; background: #aadfd0; color: #102c37; display: grid; place-items: center; }
.symbol svg { width: 25px; height: 25px; }
h1 { margin: 0; font-size: clamp(27px, 5.2vw, 44px); line-height: 1.05; letter-spacing: -.045em; }
h2 { margin: 0 0 8px; font-size: 15px; }
p { color: #cfdee5; margin: 10px 0; line-height: 1.45; }
code { color: #d9ecec; overflow-wrap: anywhere; font-size: .82rem; }
fieldset { border: 0; margin: 18px 0; padding: 0; }
legend { padding: 0 0 8px; font-weight: 650; }
.option, li { padding: 10px 13px; background: #203d53; border-radius: 11px; display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
.option { cursor: pointer; }
.option:hover { background: #294b5e; }
.option small, li small { display: block; color: #d2dfe5; margin-top: 3px; line-height: 1.35; }
input[type="checkbox"] { appearance: none; flex: 0 0 37px; height: 22px; margin: 0; border: 1px solid #a7c6ce; border-radius: 16px; background: #102536; cursor: pointer; }
input[type="checkbox"]::before { content: ""; display: block; width: 14px; height: 14px; margin: 3px; border-radius: 50%; background: #cfdee5; }
input[type="checkbox"]:checked { background: #acdccc; border-color: #acdccc; }
input[type="checkbox"]:checked::before { transform: translateX(15px); background: #102c37; }
:focus-visible { outline: 3px solid #ffd287; outline-offset: 4px; }
.destination { border-left: 2px solid #70bda9; padding-left: 12px; }
ol { list-style: none; padding: 0; margin: 18px 0 24px; }
li.pending, li.skipped { background: #1a3449; color: #c0d4de; }
li.running { background: #2c5366; }
li.failed { box-shadow: inset 0 0 0 1px #ffaca4; }
.indicator { color: #9ee4b9; min-width: 20px; text-align: center; font-weight: 700; }
.pending .indicator, .skipped .indicator { color: #c0d4de; }
.failed .indicator { color: #ffaca4; }
.running .indicator { color: #ffd287; }
.rail { position: relative; height: 6px; margin: 28px 7px 23px; border-radius: 8px; background: #081824; --progress: 0%; }
.fill { position: absolute; top: 0; bottom: 0; width: var(--progress); border-radius: inherit; background: #ffcb77; transition: width .3s ease-out; }
.marker { position: absolute; top: 50%; left: var(--progress); border: 2px solid #ffdb9e; width: 14px; height: 14px;
  background: #ffcb77; border-radius: 50%; translate: -50% -50%; transition: left .3s ease-out; box-shadow: 0 0 12px #ffcb7790; }
.actions { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-top: 21px; }
.actions label { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-left: auto; font-size: .87rem; }
button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid #6e9baa; background: #183749; color: #f3f7f9; padding: 9px 14px; }
button.primary { color: #112b35; background: #a7dfce; border-color: #a7dfce; font-weight: 700; }
button:disabled { cursor: wait; opacity: .55; }
#feedback { color: #ffd0a6; }
@media (max-width: 560px) { .actions label { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
.reduce-motion *, .reduce-motion *::before { animation: none !important; transition: none !important; }
</style>
<script src="installer.js" defer></script>
</head>
<body>
<main>
  <header>
    <div class="symbol" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15.5 12 6l8 9.5M7 18l5-6 5 6M12 18h0"/></svg>
    </div>
    <h1 id="title" tabindex="-1">Setup</h1>
    <p id="summary" role="status">Connecting to setup…</p>
  </header>
  <section id="review" hidden>
    <p class="destination"><strong>Install location</strong><br><code id="destination"></code></p>
    <fieldset id="options"><legend>Customize setup</legend></fieldset>
  </section>
  <section id="work" aria-label="Installation steps" hidden>
    <ol id="steps"></ol>
    <div class="rail" id="rail" role="progressbar" aria-label="Installation steps completed"
      aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div><div class="marker"></div></div>
  </section>
  <p id="feedback" role="alert" hidden></p>
  <div class="actions" id="actions" hidden>
    <button type="button" id="install" class="primary">Install</button>
    <button type="button" id="cancel" hidden>Stop setup</button>
    <button type="button" id="close">Close setup</button>
    <label><input type="checkbox" id="motion"> Reduce motion</label>
  </div>
</main>
</body>
</html>
