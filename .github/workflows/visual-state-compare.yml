name: Visual state comparison
on:
  pull_request:
    paths:
      - "capabilities/visual-state-compare/**"
      - ".github/workflows/visual-state-compare.yml"
  push:
    paths:
      - "capabilities/visual-state-compare/**"
      - ".github/workflows/visual-state-compare.yml"
permissions:
  contents: read
jobs:
  synthetic-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependency
        run: python -m pip install 'Pillow==11.3.0'
      - name: Black-box synthetic acceptance
        run: python -m unittest discover -s capabilities/visual-state-compare/tests -v
