name: Media transcript acquisition
on:
  pull_request:
    paths:
      - "capabilities/media-transcript-acquisition/**"
      - ".github/workflows/media-transcript-acquisition.yml"
  push:
    paths:
      - "capabilities/media-transcript-acquisition/**"
      - ".github/workflows/media-transcript-acquisition.yml"
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'jsonschema==4.25.1'
      - run: python -m unittest discover -s capabilities/media-transcript-acquisition/tests -v
