name: Automation Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify vendored prompt upstream bytes
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest_path = Path("vendor/prompt-invocation-upstream/manifest.v1.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest["contract_id"] == "prompt-invocation-upstream/v1", manifest
          for item in manifest["files"]:
              local = Path(item["local_path"])
              assert local.is_file(), local
              observed = subprocess.check_output(
                  ["git", "hash-object", str(local)], text=True
              ).strip()
              assert observed == item["source_blob_sha"], (local, observed, item)
          PY

      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python entrypoints
        run: |
          python -m py_compile \
            scripts/prompt_runtime.py \
            scripts/path_receipt.py \
            scripts/validate_runtime_handoff.py \
            vendor/prompt-invocation-upstream/prompt_invocation_resolver.py \
            scripts/validate_idea_work_continuity.py \
            capabilities/playlist-link-extraction/extract_links.py \
            capabilities/playlist-link-extraction/core/normalize.py \
            capabilities/playlist-link-extraction/core/artifact.py \
            capabilities/playlist-link-extraction/adapters/yt-dlp-json/adapt.py \
            capabilities/playlist-link-extraction/adapters/yt-dlp-json/convert.py \
            capabilities/agent-hook-runtime/diagnose_cursor_hook.py \
            capabilities/agent-hook-runtime/core/transport.py \
            capabilities/agent-hook-runtime/adapters/cursor.py \
            capabilities/local-agent-readiness/verify.py \
            capabilities/local-agent-readiness/core/readiness.py \
            capabilities/social-publication/prototype.py \
            capabilities/social-publication/core/publication.py \
            capabilities/social-publication/adapters/linkedin.py \
            capabilities/document-formatting/plan.py \
            capabilities/document-formatting/compile.py \
            capabilities/document-formatting/core/contract.py \
            capabilities/document-formatting/core/compiler.py \
            capabilities/document-formatting/adapters/google_docs.py

      - name: Build playlist-link synthetic artifact
        run: |
          mkdir -p Outputs
          python capabilities/playlist-link-extraction/extract_links.py \
            --batch capabilities/playlist-link-extraction/fixtures/synthetic-observation-batch.v1.json \
            --output-json Outputs/playlist-link-artifact.json \
            --output-csv Outputs/playlist-link-artifact.csv

      - name: Validate playlist-link synthetic artifact receipt
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          artifact = json.loads(Path("Outputs/playlist-link-artifact.json").read_text(encoding="utf-8"))
          assert artifact["schema_version"] == "playlist-link-artifact/v1", artifact
          assert artifact["capability_id"] == "playlist-link-extraction", artifact
          assert artifact["receipt"]["occurrence_count"] == 4, artifact
          assert artifact["receipt"]["unique_link_count"] == 2, artifact
          with Path("Outputs/playlist-link-artifact.csv").open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 4, rows
          PY

      - name: Adapt yt-dlp-json fixture through reusable core
        run: |
          mkdir -p Outputs
          python capabilities/playlist-link-extraction/adapters/yt-dlp-json/adapt.py \
            --payload capabilities/playlist-link-extraction/adapters/yt-dlp-json/fixtures/sample-playlist.v1.json \
            --target-id target-a \
            --output-batch Outputs/playlist-link-observation-batch.json
          python capabilities/playlist-link-extraction/extract_links.py \
            --batch Outputs/playlist-link-observation-batch.json \
            --output-json Outputs/playlist-link-yt-dlp-artifact.json \
            --output-csv Outputs/playlist-link-yt-dlp-artifact.csv

      - name: Validate yt-dlp-json adapter and core parity receipt
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          batch = json.loads(Path("Outputs/playlist-link-observation-batch.json").read_text(encoding="utf-8"))
          assert batch["schema_version"] == "playlist-link-observation-batch/v1", batch
          assert len(batch["observations"]) == 4, batch
          assert all(item["adapter_id"] == "yt-dlp-json" for item in batch["observations"]), batch
          urls = [item["url"] for item in batch["observations"]]
          assert urls.count("https://example.test/video/2") == 2, urls

          artifact = json.loads(Path("Outputs/playlist-link-yt-dlp-artifact.json").read_text(encoding="utf-8"))
          assert artifact["receipt"]["occurrence_count"] == 4, artifact
          assert artifact["receipt"]["unique_link_count"] == 2, artifact
          assert "yt-dlp-json" in artifact["receipt"]["adapter_ids"], artifact
          with Path("Outputs/playlist-link-yt-dlp-artifact.csv").open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 4, rows
          PY

      - name: Build document-formatting synthetic plan
        run: |
          mkdir -p Outputs
          python capabilities/document-formatting/plan.py \
            --profile capabilities/document-formatting/fixtures/consumer-profile.synthetic.v1.json \
            --output Outputs/document-formatting-plan.json

      - name: Validate document-formatting synthetic plan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("Outputs/document-formatting-plan.json").read_text(encoding="utf-8"))
          assert plan["schema_version"] == "document-formatting-plan/v1", plan
          assert plan["capability_id"] == "document-formatting", plan
          assert plan["state"] == "PLAN_READY", plan
          ids = [item["stage_id"] for item in plan["stages"]]
          assert "CROSS_SURFACE_FIDELITY" in ids, ids
          assert "LOCK_NON_COLOR_MECHANICS" in ids, ids
          assert "APPLY_BRAND_OVERLAY" in ids, ids
          assert plan["terminal_dependencies"] == ["APPLY_BRAND_OVERLAY"], plan
          serialized = json.dumps(plan).lower()
          forbidden = ("nyc health", "hospitals", "northwell", "hh-metropolitan")
          assert not any(item in serialized for item in forbidden), plan
          PY

      - name: Build document-formatting P95 compiler IR
        run: |
          mkdir -p Outputs
          python capabilities/document-formatting/compile.py \
            --source capabilities/document-formatting/fixtures/document-source.synthetic.v1.json \
            --design capabilities/document-formatting/fixtures/design-spec.synthetic.v1.json \
            --output Outputs/document-formatting-ir.json \
            --receipt Outputs/document-formatting-compiler-receipt.json

      - name: Build document-formatting Google Docs adapter plan
        run: |
          python capabilities/document-formatting/adapters/google_docs.py \
            --ir Outputs/document-formatting-ir.json \
            --required-feature semantic_headings \
            --required-feature internal_navigation \
            --required-feature named_external_links \
            --required-feature inline_images \
            --required-feature revision_readback \
            --output Outputs/document-formatting-google-docs-plan.json

      - name: Validate document-formatting P95 artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ir = json.loads(Path("Outputs/document-formatting-ir.json").read_text(encoding="utf-8"))
          receipt = json.loads(Path("Outputs/document-formatting-compiler-receipt.json").read_text(encoding="utf-8"))
          plan = json.loads(Path("Outputs/document-formatting-google-docs-plan.json").read_text(encoding="utf-8"))
          assert ir["schema_version"] == "document-formatting-ir/v1", ir
          assert receipt["state"] == "COMPILED_PROVIDER_NEUTRAL_DOCUMENT", receipt
          assert receipt["compiled_sha256"] == ir["fingerprints"]["compiled"], (receipt, ir)
          assert plan["state"] == "ADAPTER_PLAN_READY", plan
          assert [p["phase_id"] for p in plan["phases"]] == [
              "CONSTRUCT_AND_STYLE",
              "RESOLVE_HEADING_IDENTITIES",
              "APPLY_INTERNAL_LINKS",
              "FINAL_READBACK",
          ], plan
          assert not plan["capability_report"]["unsupported_features"], plan
          serialized = json.dumps({"ir": ir, "plan": plan}).lower()
          forbidden = ("nyc health", "hospitals", "northwell", "hh-metropolitan", "cc reader")
          assert not any(item in serialized for item in forbidden), serialized
          PY

      - name: Build social-publication P95 success receipt
        run: |
          mkdir -p Outputs
          python capabilities/social-publication/prototype.py \
            --intent capabilities/social-publication/fixtures/text-intent.synthetic.v1.json \
            --mode success \
            --output Outputs/social-publication-p95-receipt.json

      - name: Validate social-publication P95 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("Outputs/social-publication-p95-receipt.json").read_text(encoding="utf-8"))
          assert receipt["schema_version"] == "social-publication-receipt/v1", receipt
          assert receipt["state"] == "PUBLISHED", receipt
          assert receipt["provider"] == "linkedin", receipt
          assert receipt["provider_request_state"] == "EMITTED", receipt
          assert receipt["provider_post_id"] == "urn:li:share:synthetic-p95-proof", receipt
          forbidden = ("authorization", "bearer ", "access_token", "refresh_token", "client_secret")
          serialized = json.dumps(receipt).lower()
          assert not any(item in serialized for item in forbidden), receipt
          PY

      - name: Validate local-agent readiness capability
        run: |
          mkdir -p Outputs
          python -m unittest tests.test_local_agent_readiness -v
          python capabilities/local-agent-readiness/verify.py \
            --repo-root . \
            --profile capabilities/local-agent-readiness/fixtures/profile.multi-agent.synthetic.v1.json \
            --agent cursor \
            --print-agent-profile-sha256 > Outputs/local-agent-readiness.cursor-profile-sha256.txt
          python capabilities/local-agent-readiness/verify.py \
            --repo-root . \
            --profile capabilities/local-agent-readiness/fixtures/profile.multi-agent.synthetic.v1.json \
            --agent opencode \
            --print-agent-profile-sha256 > Outputs/local-agent-readiness.opencode-profile-sha256.txt

      - name: Validate sanitized runtime handoff example
        run: |
          mkdir -p Outputs
          python scripts/validate_runtime_handoff.py \
            --packet docs/examples/runtime-handoff.example.json \
            --require-ready \
            --output Outputs/runtime-handoff-validation.json

      - name: Validate idea-work continuity deferred adoption
        run: |
          mkdir -p Outputs
          python scripts/validate_idea_work_continuity.py \
            --receipt docs/examples/idea-work-continuity.tokencorridor-deferred.v1.json \
            --output Outputs/idea-work-continuity-validation.json

      - name: Resolve P92 through pinned upstream dependency
        run: |
          mkdir -p Outputs
          python scripts/prompt_runtime.py             --text "invoke & implement P92"             --output Outputs/p92-invocation.json

      - name: Validate upstream P92 packet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("Outputs/p92-invocation.json").read_text(encoding="utf-8"))
          assert payload["overall_state"] == "RESOLVED", payload
          assert payload["upstream_contract"] == "prompt-invocation-upstream/v1", payload
          assert payload["intent"] == "EXECUTE_AND_IMPLEMENT", payload
          assert payload["implementation_required"] is True, payload
          assert payload["resolution_mode"] == "UPSTREAM_CATALOG_PINNED", payload
          resolved = payload["resolutions"][0]
          assert resolved["state"] == "RESOLVED_UPSTREAM", resolved
          assert resolved["prompt_id"] == "P92", resolved
          assert resolved["name"] == "Canonical Path Prompt", resolved
          PY

      - name: Emit P92 path and execution-context receipt
        run: |
          python scripts/path_receipt.py             --repo-root .             --output Outputs/path-receipt.json

      - name: Validate P92 checkout receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("Outputs/path-receipt.json").read_text(encoding="utf-8"))
          path = payload["path_input_receipt"]
          assert path["development_state"] == "CANONICAL_PROVED", payload
          assert path["normalized_origin_identity"] == "EndeavorEverlasting/Automation", payload
          assert path["production_use_state"] == "UNKNOWN", payload
          assert path["production_mutation_allowed"] is False, payload
          assert payload["version_receipt"]["REMOTE_INTEGRATED"] == "UNKNOWN", payload
          PY

      - name: Upload validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-validation-receipts
          path: Outputs/*.json
          if-no-files-found: error
