name: Automation Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify vendored prompt upstream bytes
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest_path = Path("vendor/prompt-invocation-upstream/manifest.v1.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest["contract_id"] == "prompt-invocation-upstream/v1", manifest
          for item in manifest["files"]:
              local = Path(item["local_path"])
              assert local.is_file(), local
              observed = subprocess.check_output(
                  ["git", "hash-object", str(local)], text=True
              ).strip()
              assert observed == item["source_blob_sha"], (local, observed, item)
          PY

      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python entrypoints
        run: |
          python -m py_compile             scripts/prompt_runtime.py             scripts/path_receipt.py             vendor/prompt-invocation-upstream/prompt_invocation_resolver.py

      - name: Resolve P92 through pinned upstream dependency
        run: |
          mkdir -p Outputs
          python scripts/prompt_runtime.py             --text "invoke & implement P92"             --output Outputs/p92-invocation.json

      - name: Validate upstream P92 packet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("Outputs/p92-invocation.json").read_text(encoding="utf-8"))
          assert payload["overall_state"] == "RESOLVED", payload
          assert payload["upstream_contract"] == "prompt-invocation-upstream/v1", payload
          assert payload["intent"] == "EXECUTE_AND_IMPLEMENT", payload
          assert payload["implementation_required"] is True, payload
          assert payload["resolution_mode"] == "UPSTREAM_CATALOG_PINNED", payload
          resolved = payload["resolutions"][0]
          assert resolved["state"] == "RESOLVED_UPSTREAM", resolved
          assert resolved["prompt_id"] == "P92", resolved
          assert resolved["name"] == "Canonical Path Prompt", resolved
          PY

      - name: Emit P92 path and execution-context receipt
        run: |
          python scripts/path_receipt.py             --repo-root .             --output Outputs/path-receipt.json

      - name: Validate P92 checkout receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("Outputs/path-receipt.json").read_text(encoding="utf-8"))
          path = payload["path_input_receipt"]
          assert path["development_state"] == "CANONICAL_PROVED", payload
          assert path["normalized_origin_identity"] == "EndeavorEverlasting/Automation", payload
          assert path["production_use_state"] == "UNKNOWN", payload
          assert path["production_mutation_allowed"] is False, payload
          assert payload["version_receipt"]["REMOTE_INTEGRATED"] == "UNKNOWN", payload
          PY

      - name: Upload validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-validation-receipts
          path: Outputs/*.json
          if-no-files-found: error
